memory_limit = 512M
post_max_size = 40M
upload_max_filesize = 40M
max_execution_time = 120
date.timezone = America/Campo_Grande
session.save_path = "/tmp"
session.cookie_samesite = "None"
session.cookie_secure = 1

; Producao: nao vazar erros/warnings do PHP na resposta HTTP.
; O php:8.2-apache sem php.ini deixa display_errors=On por padrao, e o GLPI
; 10.0.16 nao desliga sozinho no modo normal. Um Warning do GLPI ao processar
; inventario (ex: InventoryAsset.php) sujava a resposta e o GLPI-Agent achava
; que tinha falhado (o inventario entrava do mesmo jeito).
display_errors = Off
log_errors = On
