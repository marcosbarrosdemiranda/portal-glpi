# Stack de produção rodando em 192.168.1.198 — ver Portal-Glpi/Arquitetura/PLANO_MIGRACAO_DOCKER.md
# Código-fonte (GLPI + portal-glpi) montado direto da pasta viva do XAMPP (C:\xampp\htdocs\glpi2) —
# o sync automático pro servidor continua funcionando sem mudanças, já que o caminho é o mesmo de sempre.
# XAMPP (Apache/MySQL) deve estar PARADO antes de subir esse compose.
# Porta 7412 escolhida a pedido do usuário — 80/8091 já reservadas no pfSense, DNS/proxy será configurado depois.
services:
  glpi-db:
    image: mariadb:10.4
    container_name: glpi-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: glpi2
    volumes:
      - glpi_db_data:/var/lib/mysql
    networks:
      - glpi-net

  glpi-web:
    build: .
    container_name: glpi-web
    restart: unless-stopped
    depends_on:
      - glpi-db
    volumes:
      - C:\xampp\htdocs\glpi2:/var/www/html/glpi2
    ports:
      - "7412:80"
    networks:
      - glpi-net

  glpi-cron:
    build: .
    container_name: glpi-cron
    restart: unless-stopped
    depends_on:
      - glpi-db
    volumes:
      - C:\xampp\htdocs\glpi2:/var/www/html/glpi2
    entrypoint: ["sh", "-c", "while true; do php /var/www/html/glpi2/front/cron.php; sleep 60; done"]
    networks:
      - glpi-net

volumes:
  glpi_db_data:

networks:
  glpi-net:
    driver: bridge
