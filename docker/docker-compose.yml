# Stack de produção rodando em 192.168.1.198 — ver Portal-Glpi/Arquitetura/PLANO_MIGRACAO_DOCKER.md
# Código-fonte (GLPI + portal-glpi) mora em D:\docker\glpi-portal\glpi2 (movido de C:\xampp\htdocs\glpi2
# em 2026-07-19, pra poder desinstalar o XAMPP sem perder dados). Sync automático pro servidor agora
# usa scp direto pra esse caminho (não é mais a pasta \\192.168.1.198\xampp, que não existe mais).
# Porta 7412 escolhida a pedido do usuário — 80/8091 já reservadas no pfSense, DNS/proxy será configurado depois.
services:
  glpi-db:
    image: mariadb:10.4
    container_name: glpi-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: glpi2
    volumes:
      - glpi_db_data:/var/lib/mysql
    networks:
      - glpi-net

  glpi-web:
    build: .
    container_name: glpi-web
    restart: unless-stopped
    depends_on:
      - glpi-db
    volumes:
      - D:\docker\glpi-portal\glpi2:/var/www/html/glpi2
    ports:
      - "7412:80"
    networks:
      - glpi-net

  glpi-cron:
    build: .
    container_name: glpi-cron
    restart: unless-stopped
    depends_on:
      - glpi-db
    volumes:
      - D:\docker\glpi-portal\glpi2:/var/www/html/glpi2
    entrypoint: ["sh", "-c", "while true; do php /var/www/html/glpi2/front/cron.php; sleep 60; done"]
    networks:
      - glpi-net

volumes:
  glpi_db_data:

networks:
  glpi-net:
    driver: bridge
