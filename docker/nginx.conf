server {
    listen 443 ssl;
    server_name ti.grupogmais.com;

    ssl_certificate     /etc/letsencrypt/live/ti.grupogmais.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ti.grupogmais.com/privkey.pem;

    # Uploads (anexos de chamado, docs): PHP aceita 40M — nginx precisa acompanhar
    client_max_body_size 45m;

    location / {
        proxy_pass http://glpi-web:80;
        proxy_set_header Host $http_host;              # inclui a :7412 — GLPI compara Origin/Referer com a url_base
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 7412;

        # Operações lentas do GLPI (fechar chamado, relatórios) não podem cair em 504
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ── HTTP porta 80: só pro GLPI Agent (inventário) ─────────────────────────────
# Os PDVs/PCs não resolvem ti.grupogmais.com pro IP interno (split-horizon não
# cobre as VLANs de loja), então o agente fala HTTP direto no IP 192.168.1.198.
# Aqui só o tráfego do agente é encaminhado pro container; qualquer outra coisa
# na porta 80 é redirecionada pro HTTPS (ninguém usa o portal em claro).
server {
    listen 80;
    server_name _;

    client_max_body_size 45m;

    location /glpi2/ {
        # só o GLPI-Agent passa; humanos vão pro HTTPS
        if ($http_user_agent !~* "GLPI-Agent") {
            return 301 https://ti.grupogmais.com:7412$request_uri;
        }
        proxy_pass http://glpi-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        return 301 https://ti.grupogmais.com:7412$request_uri;
    }
}
