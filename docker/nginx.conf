server {
    listen 443 ssl;
    server_name ti.grupogmais.com;

    ssl_certificate     /etc/letsencrypt/live/ti.grupogmais.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ti.grupogmais.com/privkey.pem;

    location / {
        proxy_pass http://glpi-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
